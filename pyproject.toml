[project]
name = "skoleklar"
version = "0.1.0"
description = "Ready for school: the household's board, phone and brief, built on skolekit for SkoleIntra"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13.0,<5",
  "httpx>=0.28.0,<1",
  "jsonschema>=4.25.0,<5",
  "keyring>=25.6.0,<26",
]

[project.scripts]
skoleklar = "skoleklar.cli:main"
skolekit = "skolekit.cli:main"

[project.optional-dependencies]
browser = ["playwright>=1.55.0,<2"]
board = ["pillow==13.0.0"]
server = ["fastapi>=0.116.0,<1", "uvicorn>=0.35.0,<1"]
gcp = ["google-cloud-storage>=3.3.0,<4"]
mcp = [
    "mcp>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skolekit", "src/skoleklar"]

[dependency-groups]
dev = [
  "mcp>=2.3.0",
  "pytest>=8.4.0,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests_python"]
markers = ["pipeline: the typed-pipeline refactor's core set, from extraction to pixels"]
