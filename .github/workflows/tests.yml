name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only: the tests need the code and nothing else.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # The same Ubuntu (noble) and Python as the cloud images (Dockerfile, Dockerfile.delivery),
    # so the tests see the fonts and interpreter the deployed code runs with.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions are pinned to a commit; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: uv run playwright install --with-deps chromium
      # The household guard has no owner's files here, so it checks only for real-looking
      # addresses, home paths and gateway hosts. The names are checked by the
      # pre-commit hook on the owner's machine.
      - run: uv run pytest -q
